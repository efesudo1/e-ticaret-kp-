version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: kpi_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: KpiDash2026!
      MYSQL_DATABASE: kpi_dashboard
      MYSQL_USER: kpi_user
      MYSQL_PASSWORD: KpiUser2026!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kpi_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  redis_data:
